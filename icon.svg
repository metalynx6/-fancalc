<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9eb5" />
      <stop offset="50%" stop-color="#ff758c" />
      <stop offset="100%" stop-color="#ff6b8b" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff5f8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.18" flood-color="#4a0e1e" />
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Cat Ears -->
  <path d="M 100 130 L 160 50 L 210 130 Z" fill="#ffb8cc" />
  <path d="M 120 125 L 160 70 L 190 125 Z" fill="#ff758c" />

  <path d="M 412 130 L 352 50 L 302 130 Z" fill="#ffb8cc" />
  <path d="M 392 125 L 352 70 L 322 125 Z" fill="#ff758c" />

  <!-- Calculator Screen -->
  <rect x="85" y="140" width="342" height="130" rx="36" fill="url(#screenGrad)" />

  <!-- Eyes & Mascot Face -->
  <circle cx="160" cy="190" r="14" fill="#3c2a30" />
  <circle cx="156" cy="186" r="4" fill="#ffffff" />

  <circle cx="352" cy="190" r="14" fill="#3c2a30" />
  <circle cx="348" cy="186" r="4" fill="#ffffff" />

  <ellipse cx="145" cy="216" rx="16" ry="8" fill="#ff758c" opacity="0.6" />
  <ellipse cx="367" cy="216" rx="16" ry="8" fill="#ff758c" opacity="0.6" />

  <!-- Mouth -->
  <path d="M 244 200 Q 256 215 268 200" fill="none" stroke="#3c2a30" stroke-width="4" stroke-linecap="round" />

  <!-- Mini Fraction a/b on screen -->
  <text x="256" y="246" font-family="Fredoka, sans-serif" font-weight="700" font-size="24" fill="#ff6b8b" text-anchor="middle">½ + ¼ = ¾</text>

  <!-- Keypad Buttons -->
  <g fill="#ffffff" opacity="0.95">
    <!-- Row 1 -->
    <rect x="95" y="295" width="65" height="42" rx="16" />
    <rect x="175" y="295" width="65" height="42" rx="16" />
    <rect x="255" y="295" width="65" height="42" rx="16" />
    <rect x="335" y="295" width="82" height="42" rx="16" fill="#ffe0eb" />

    <!-- Row 2 -->
    <rect x="95" y="352" width="65" height="42" rx="16" />
    <rect x="175" y="352" width="65" height="42" rx="16" />
    <rect x="255" y="352" width="65" height="42" rx="16" />
    <rect x="335" y="352" width="82" height="42" rx="16" fill="#ffe0eb" />

    <!-- Row 3 -->
    <rect x="95" y="410" width="65" height="42" rx="16" />
    <rect x="175" y="410" width="65" height="42" rx="16" />
    <rect x="255" y="410" width="65" height="42" rx="16" />
    <rect x="335" y="410" width="82" height="42" rx="16" fill="#ff6b8b" />
  </g>
</svg>

